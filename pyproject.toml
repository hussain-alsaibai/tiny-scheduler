[project]
name = "tiny-scheduler"
version = "0.1.0"
description = "Zero-dependency cron scheduler for Python. Cron expressions, intervals, one-shot timers, async."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Hussain Al-Saibai"}]
keywords = ["scheduler", "cron", "periodic-tasks", "task-scheduler", "zero-dependency"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-scheduler"
Repository = "https://github.com/hussain-alsaibai/tiny-scheduler"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["test_tiny_scheduler.py"]